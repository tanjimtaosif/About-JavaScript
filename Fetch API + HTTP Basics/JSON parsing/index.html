<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
      <h1 class="text-3xl font-bold text-white mb-4 text-center">
        Active Users
      </h1>
      <div
        class="users grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 justify-items-center"
      ></div>
    </div>

    <button
      id="refreshBtn"
      class="block mx-auto mb-8 px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg transition duration-300 ease-in-out transform hover:scale-105 shadow-lg"
    >
      Refresh Users
    </button>
    
    <script src="script.js"></script>
  </body>
</html>
