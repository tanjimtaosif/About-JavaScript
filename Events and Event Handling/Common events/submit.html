<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        html, body{
            width: 100%;
            height: 100%;
        }
        #main{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #222;
            flex-direction: column;
            gap: 10px;
        }

        h1{
            color: #555;
            font-size: 8rem;
            font-weight: 300;
            user-select: none;
        }

        #upld{
            padding: 12px 22px;
            background-color: rgb(99, 143, 128);
            color: white;
            font-weight: 600;
            border-radius: 10px;
        }

        #upld:hover{
            background-color: rgb(62, 82, 75);
        }

        input{
            display: block;
            padding: 10px 15px;
            margin-bottom: 2px;
        }

        .card{
            max-width: 400px;
            color: white;
            padding: 20px;
            border: 2px solid #e3e3e3;
            display: inline-block;
            border-radius: 5px;
        }

        .card p{
            font-size: 12px;
            margin-top: 10px;
        }

        .card h5{
            margin-top: 5px;
        }
        .profile{
            width: 40px;
            height: 40px;
            border-radius:10% ;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .profile img{
            width:100%;
            height: 100%;
            object-fit: cover;
            
        }
    </style>
</head>
<body>
    <div id="main">
        <form action="">
            <input type="text" placeholder="Profile Pic">
            <input type="text" placeholder="Name">
            <input type="text" placeholder="Occupation">
            <input type="text" placeholder="Information">
            <input type="submit">
        </form>

</body>
</html>
