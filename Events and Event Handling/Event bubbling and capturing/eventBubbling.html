<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        position: relative;
        overflow: hidden;
        padding: 30px;
        background: #222;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 5%;
        background-color: #222;
        color: white;
      }

      .nav-links {
        display: flex;
        list-style: none;
      }

      .nav-links li {
        margin: 0 20px;
      }

      .nav-links a {
        text-decoration: none;
        color: white;
        font-weight: 500;
        transition: color 0.3s;
      }
      .btn-signup {
        background-color: aquamarine;
        color: #222;
        padding: 8px 20px;
        border-radius: 5px;
        text-decoration: none;
        font-weight: 600;
        transition: background 0.3s;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">MyBrand</div>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Service</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
      <a href="#" class="btn-signup">Sign Up</a>
    </nav>

    <script src="eventBubbling.js"></script>
  </body>
</html>
