<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fruit List Toggle</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        position: relative;
        overflow: hidden;
        padding: 30px;
        background: #222;
      }

      #main {
        display: flex;
        width: 100%;
        height: 100%;
      }

      li {
        color: white;
        cursor: pointer;
        padding: 5px 0;
        font-size: 20px;
        list-style-position: inside;
      }

      .lt {
        text-decoration: line-through;
        color: #777;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <ul>
        <li>apple</li>
        <li>Orange</li>
        <li>Grapes</li>
        <li>Pineapple</li>
        <li>Mango</li>
        <li>Strawberry</li>
      </ul>
    </div>
    <script src="eventBubblingEx.js"></script>
  </body>
</html>
