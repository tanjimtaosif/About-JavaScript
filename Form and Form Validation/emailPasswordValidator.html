<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email & Password Validator</title>
    <style>
      /* General Setup */
      body {
        background-color: #0f172a;
        font-family: "Inter", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        color: white;
      }

      /* Card Styling */
      .container {
        background-color: #1e293b;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 350px;
      }

      h2 {
        margin-bottom: 20px;
        font-weight: 500;
        text-align: center;
      }

      /* Input Grouping */
      .input-group {
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
      }

      label {
        font-size: 13px;
        margin-bottom: 6px;
        color: #94a3b8;
      }

      input {
        padding: 12px;
        border-radius: 6px;
        border: 2px solid #334155;
        background-color: #0f172a;
        color: white;
        outline: none;
        transition: 0.3s;
      }

      /* Error Message (Hidden by default) */
      .error-text {
        color: #f87171;
        font-size: 11px;
        margin-top: 5px;
      }

      /* Validation Classes for JS to toggle */
      input.invalid {
        border-color: #f87171;
      }
      input.valid {
        border-color: #4ade80;
      }

      button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        background-color: #38bdf8;
        border: none;
        border-radius: 6px;
        color: #0f172a;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background-color: #7dd3fc;
      }

      #mainMessage {
        text-align: center;
        color: #f87171;
        font-size: 14px;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <form id="authForm" autocomplete="off">
        <h2>Create Account</h2>

        <div class="input-group">
          <label for="email">Email</label>
          <input type="text" id="email" placeholder="e.g. name@mail.com" />
          <small class="error-text" id="emailError"></small>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Minimum 8 characters"
          />
          <small class="error-text" id="passError"></small>
        </div>

        <button type="submit" id="submitBtn">Register</button>

        <p id="mainMessage"></p>
      </form>
    </div>

    <script src="emailPasswordValidator.js"></script>
  </body>
</html>
