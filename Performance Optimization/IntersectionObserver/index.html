<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Landing Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero-content">
        <h1>Capture the Moment</h1>
        <p>Explore the world through a different lens.</p>
        <a href="#section-1" class="btn">Start Exploring</a>
      </div>
    </header>

    <section id="section-1" class="image-section">
      <div class="container">
        <img
          data-src="https://picsum.photos/1200/600?random=1"
          alt="Nature Vista"
        />
      </div>
    </section>
    <div class="breaker"><span></span></div>

    <section id="section-2" class="image-section">
      <div class="container">
        <img
          data-src="https://picsum.photos/1200/600?random=2"
          alt="Urban Life"
        />
      </div>
    </section>
    <div class="breaker"><span></span></div>

    <section id="section-3" class="image-section">
      <div class="container">
        <img
          data-src="https://picsum.photos/1200/600?random=3"
          alt="Abstract Art"
        />
      </div>
    </section>
    <!-- <div class="breaker"><span></span></div> -->

    <script src="script.js"></script>
  </body>
</html>
