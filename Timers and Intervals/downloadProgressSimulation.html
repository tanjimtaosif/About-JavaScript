<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glassmorphism Download Simulation</title>

    <style>
      /* ===== Reset ===== */
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      /* ===== Background ===== */
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ===== Glass Card ===== */
      .glass-card {
        width: 360px;
        padding: 28px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        color: #ffffff;
      }

      /* ===== Title ===== */
      .glass-card h2 {
        margin: 0 0 10px;
        font-size: 1.4rem;
        font-weight: 600;
      }

      /* ===== Status Text ===== */
      .status {
        font-size: 0.9rem;
        opacity: 0.9;
        margin-bottom: 16px;
      }

      /* ===== Progress Bar ===== */
      .progress-container {
        width: 100%;
        height: 14px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 14px;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.9),
          rgba(255, 255, 255, 0.6)
        );
        border-radius: 10px;
        transition: width 0.3s ease;
      }

      /* ===== Percentage ===== */
      .percent {
        text-align: right;
        font-size: 0.85rem;
        margin-bottom: 18px;
      }
    </style>
  </head>

  <body>
    <div class="glass-card">
      <h2>File Download</h2>
      <div class="status" id="status">Ready to download</div>

      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="percent" id="percent">0%</div>
    </div>

    <script src="downloadProgressSimulation.js"></script>
  </body>
</html>
