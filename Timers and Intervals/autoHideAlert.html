<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Hide Alert Banner</title>

    <style>
      /* ===== Reset ===== */
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      /* ===== Page Background ===== */
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ===== Alert Banner ===== */
      .alert-banner {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 14px 26px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #ffffff;
        font-size: 0.9rem;
        font-weight: 500;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        opacity: 1;
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
        z-index: 1000;
      }

      /* ===== Hidden State ===== */
      .alert-banner.hide {
        opacity: 0;
        transform: translateX(-50%) translateY(-20px);
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div class="alert-banner" id="alert">Download started successfully</div>

    <script src="autoHideAlert.js"></script>
  </body>
</html>
